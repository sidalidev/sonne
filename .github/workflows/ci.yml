name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so an outdated security review fails even without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-repo.sh

  relay:
    name: Relay tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm test

  android:
    name: Android tests, lint, release build, permissions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and release build (unsigned)
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
      - name: No permission outside docs/permissions.txt
        run: ../tools/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk
